Builds:
  - versionName: 1.0.2
    versionCode: 6
    commit: 05497acef197fa856fe7d10785d5daac65839dcd
    subdir: app
    gradle:
      - yes
    srclibs:
      - RootEncoder@2.7.2
      - RTSP-Server@1.4.1
    prebuild:
      - sed -i 's|^org.gradle.java.home|#org.gradle.java.home|' ../gradle.properties
      - sed -i '/maven.*jitpack/a\        mavenLocal()' ../build.gradle
      - sed -i 's|com.github.pedroSG94.RootEncoder:library:2.7.2|com.github.pedroSG94:library:2.7.2|'
        build.gradle
      - sed -i 's|com.github.pedroSG94:RTSP-Server:1.4.1|com.github.pedroSG94:rtspserver:1.4.1|'
        build.gradle
      - pushd $$RTSP-Server$$
      - sed -i 's|com.github.pedroSG94.RootEncoder:library|com.github.pedroSG94:library|'
        gradle/libs.versions.toml
      - sed -i '/jitpack/a\            mavenLocal()' settings.gradle.kts
      - popd
      - pushd $$RootEncoder$$
      - ./gradlew :library:publishToMavenLocal :encoder:publishToMavenLocal :rtmp:publishToMavenLocal
        :rtsp:publishToMavenLocal :srt:publishToMavenLocal :udp:publishToMavenLocal
        :common:publishToMavenLocal
      - popd
      - pushd $$RTSP-Server$$
      - ./gradlew :rtspserver:publishToMavenLocal
      - popd
      - sed -i '/signingConfig /d' build.gradle

