Builds:
  - versionName: 1.0.2
    versionCode: 6
    commit: 05497acef197fa856fe7d10785d5daac65839dcd
    subdir: app
    gradle:
      - yes
    srclibs:
      - RootEncoder@2.7.2
      - RTSP-Server@1.4.1
    prebuild:
      - sed -i 's|^org.gradle.java.home|#org.gradle.java.home|' ../gradle.properties
      - sed -i '/maven.*jitpack/a\        mavenLocal()' ../build.gradle
      - sed -i 
        's|com.github.pedroSG94.RootEncoder:library:2.7.2|com.github.pedroSG94:library:2.7.2|'
        build.gradle
      - sed -i 
        's|com.github.pedroSG94:RTSP-Server:1.4.1|com.github.pedroSG94:rtspserver:1.4.1|'
        build.gradle
      - pushd $$RTSP-Server$$
      - sed -i 's|com.github.pedroSG94.RootEncoder:library|com.github.pedroSG94:library|'
        gradle/libs.versions.toml
      - sed -i '/jitpack/a\            mavenLocal()' settings.gradle.kts
      - popd
      - curl -fsSL -o /tmp/jdk17.tar.gz 
        https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.21%2B9/OpenJDK17U-jdk_x64_linux_hotspot_17.0.21_9.tar.gz
      - echo "8b9b611d917e3dfd8419d3566b5949226f69b052fed7e109c1368add1dfe8711  /tmp/jdk17.tar.gz"
        | sha256sum -c -
      - mkdir -p /tmp/jdk17 ~/.gradle
      - tar -xzf /tmp/jdk17.tar.gz -C /tmp/jdk17 --strip-components=1
      - echo "org.gradle.java.installations.paths=/tmp/jdk17" >> ~/.gradle/gradle.properties
      - pushd $$RootEncoder$$
      - ./gradlew :library:publishToMavenLocal :encoder:publishToMavenLocal :rtmp:publishToMavenLocal
        :rtsp:publishToMavenLocal :srt:publishToMavenLocal :udp:publishToMavenLocal
        :common:publishToMavenLocal
      - popd
      - pushd $$RTSP-Server$$
      - ./gradlew :rtspserver:publishToMavenLocal
      - popd
      - sed -i '/signingConfig /d' build.gradle

AutoUpdateMode: Version
UpdateCheckMode: Tags
